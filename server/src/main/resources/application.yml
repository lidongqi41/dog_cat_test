server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/warmpaws?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:warmpaws}
    password: ${DB_PASSWORD:warmpaws}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

app:
  version: ${APP_VERSION:v0.2.0}
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:8080}
  jwt:
    secret: ${JWT_SECRET:warmpaws-dev-secret-please-change-32bytes-min}
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    mock: ${AUTH_MOCK:true}
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:}
      bucket: ${COS_BUCKET:}
      domain: ${COS_DOMAIN:}

logging:
  level:
    com.warmpaws: info
